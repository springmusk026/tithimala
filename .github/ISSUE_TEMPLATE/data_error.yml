name: Calendar data error
description: Report an incorrect BS date, month length, tithi, festival, holiday, or spelling.
labels: ["type: data-error", "area: data"]
body:
  - type: input
    id: bs_date
    attributes:
      label: BS date
      description: Bikram Sambat date in YYYY-MM-DD format.
      placeholder: "2082-01-01"
    validations:
      required: true

  - type: input
    id: ad_date
    attributes:
      label: Corresponding AD date
      description: Optional Gregorian date in YYYY-MM-DD format.
      placeholder: "2025-04-14"
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Data category
      description: Choose the category that best matches the error.
      options:
        - Month length / BS-AD conversion
        - Tithi
        - Festival
        - Public holiday
        - Nepali/English name or spelling
    validations:
      required: true

  - type: textarea
    id: current_value
    attributes:
      label: Value currently shown in Tithimala
      description: Copy or describe what the app displays right now.
    validations:
      required: true

  - type: textarea
    id: expected_value
    attributes:
      label: Expected value
      description: State the correct value that should appear.
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Official source or reference
      description: Cite an official source such as Nepal Panchanga Nirnayak Samiti, the Nepal Gazette (Rajpatra), or an official government notice. Include a link or document details.
    validations:
      required: true
