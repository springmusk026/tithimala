name: Feature request
description: Propose a new capability or improvement that fits Tithimala's scope.
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        ### Scope note

        Tithimala is a focused, offline-first Nepali calendar. By design, it does not include news feeds, horoscopes (rashifal), forex rates, radio streams, user accounts, cloud sync, ads, or analytics. Proposals outside this scope will be closed.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the user need or friction you want to solve.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature should work, including any UI, widget, or localization details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional notes on other approaches or workarounds you considered.
    validations:
      required: false
